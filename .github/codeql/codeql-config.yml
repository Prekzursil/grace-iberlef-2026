name: "CodeQL config"

# Scan the maintained code: the library, its tests, and the operator scripts
# (scripts/ is maintained per pyproject's [tool.ruff] policy). FINAL/,
# notebooks/ and experiments/ stay excluded: frozen Kaggle-run records,
# machine-generated or one-off research trees, also excluded from the lint
# surface (see .pre-commit-config.yaml). The real taint findings CodeQL
# raised in FINAL/kaggle_runs/orchestrate.py were fixed in PRs #22/#23
# before the tree returned to its documented frozen-record scope.

# Fleet CODEQL DECISION (owner): BOTH suites must run. The QZP
# reusable-codeql.yml wrapper pins `queries: security-and-quality` on the
# init step; CodeQL MERGES config-file queries with that input, so declaring
# security-extended here yields security-extended + security-and-quality —
# strictly subsuming the default and extended suites. (A self-contained
# advanced workflow replacing the wrapper was attempted and rolled back:
# GitHub rejects advanced-configuration SARIF while default setup is
# enabled, and the wrapper's PR-head checkout + fail-closed
# `codeql / CodeQL` gate are what this repo's branch protection is built
# against.)
queries:
  - uses: security-extended
