# CodeQL — fleet ADVANCED configuration (self-contained).
#
# Replaces the thin quality-zero-platform reusable-codeql.yml caller: that
# wrapper pins queries to security-and-quality only, while the fleet standard
# (owner decision) requires BOTH suites inline:
#   queries: security-extended,security-and-quality
# (security-extended + security-and-quality strictly subsumes the default
# suite and the extended suite.)
#
# Scan scope stays declared by .github/codeql/codeql-config.yml (paths:
# grace, tests, scripts, FINAL — the maintained library, its tests, the
# operator scripts, and the final Kaggle run tree where real taint findings
# were fixed; notebooks/ and experiments/ remain excluded as documented
# machine-generated / one-off research trees in that file).
name: codeql

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
