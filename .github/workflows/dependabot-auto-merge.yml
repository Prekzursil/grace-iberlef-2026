name: dependabot-auto-merge

# Keeps the repo green-by-default: when Dependabot opens a PR, enable GitHub
# native auto-merge (squash). GitHub only completes the merge once every
# required status check (the "quality" gate + branch protection) is GREEN, so
# this never force-merges a red PR -- it just queues the merge to happen on pass.

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
