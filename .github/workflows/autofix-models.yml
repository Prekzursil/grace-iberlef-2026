# Tier-2 of this repo's 3-tier green-keeping automation (free, in-Actions).
#
# When the default-branch CI fails, draft a candidate fix with a FREE GitHub
# Models model (openai/gpt-4o-mini via actions/ai-inference, authenticated with
# the built-in GITHUB_TOKEN) and open a PR labelled `autofix`.
#
# Safety / bounds:
#   * Only runs on a FAILED `quality-zero-ci` run on `main` (push event).
#   * The fix PR is NEVER auto-merged. It passes through the same required
#     status checks (quality / build-test / CodeQL / dependency-review) and
#     human review as any other PR -- the dependabot auto-merge workflow is
#     scoped to dependabot[bot] only, so this PR cannot self-merge.
#   * The model context is capped and a bad/empty/non-applying patch is a
#     no-op (the job exits cleanly without opening a PR).
name: Autofix (GitHub Models)

on:
  workflow_run:
    workflows: ["quality-zero-ci"]
    types: [completed]

permissions: {}

concurrency:
  group: autofix-models-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  draft-fix:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      models: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Collect failing CI logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set +e
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > ci-failure.log 2>&1
          # Cap the context so the model request stays small and bounded.
          tail -c 16000 ci-failure.log > ci-failure.trunc.log 2>/dev/null || true
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Failed workflow: $RUN_NAME"
            echo "Commit: $HEAD_SHA"
            echo "--- failing log tail ---"
            cat ci-failure.trunc.log 2>/dev/null
          } > model-input.txt
          echo "Collected $(wc -c < model-input.txt) bytes of failure context."

      - name: Draft fix with GitHub Models
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          max-tokens: 2000
          system-prompt: >-
            You are a CI repair assistant for a .NET 8 / C# repository. You are
            given the tail of a failing CI log. Respond with ONLY a single valid
            unified diff that is compatible with `git apply` (use a/ and b/ path
            prefixes). Do not include explanations, commentary, or markdown code
            fences. If you cannot determine a safe, high-confidence fix from the
            log alone, respond with exactly: NO_FIX
          prompt-file: model-input.txt

      - name: Apply patch and open fix PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          printf '%s\n' "$AI_RESPONSE" > model-output.patch
          # Strip any accidental markdown fences the model may have added.
          sed -i '/^```/d' model-output.patch
          if grep -q '^NO_FIX' model-output.patch \
             || ! grep -Eq '^(diff --git|--- )' model-output.patch; then
            echo "Model produced no actionable patch; nothing to do."
            exit 0
          fi
          if ! git apply --check model-output.patch 2>/dev/null; then
            echo "Patch did not apply cleanly; leaving for human / Copilot escalation."
            exit 0
          fi
          git apply model-output.patch
          BRANCH="autofix/models-${HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: draft CI repair for ${HEAD_SHA} (GitHub Models)"
          git push origin "$BRANCH"
          gh label create autofix --color FBCA04 \
            --description "Automated fix draft (GitHub Models)" 2>/dev/null || true
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "autofix: repair failing CI on main (${HEAD_SHA})" \
            --label autofix \
            --body "Automated draft fix generated by the GitHub Models inference action after \`quality-zero-ci\` failed on \`main\` (run ${RUN_ID}).

          **Not auto-merged** -- this PR is gated by the same required status checks and needs human review. If the required checks still fail here and the fix is non-trivial, escalate per the Copilot coding-agent step documented in the README."
