# Checks the repository's former in-repo quality gate ran that the QZP lean
# gate (quality.yml) does not: mypy with the strict overrides for grace.io and
# grace.eval (the lean gate type-checks with basedpyright at the standard
# bar), the Semgrep registry packs (the lean gate's SAST runs opengrep with the
# curated .quality/opengrep rules), and a secret scan over the full history
# (the lean gate's gitleaks scans the shallow checkout).
name: extended scans

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # a merge queue's synthetic commit must report the required check too
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: extended-scans-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mypy:
    name: types (mypy, strict grace.io + grace.eval)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # requirements.txt is the universal lock, so on Linux it carries torch's CUDA
      # runtime (nvidia-*, cuda-*, triton): gigabytes a type check never uses. This
      # job installs the CPU build of the same torch release and the rest of the lock.
      - name: Install the pinned dependency closure (CPU torch) + mypy
        run: |
          set -euo pipefail
          torch_version="$(grep -m1 -E '^torch==' requirements.txt | cut -d= -f3 | cut -d' ' -f1 | cut -d';' -f1)"
          test -n "$torch_version"
          grep -v -E '^(nvidia-|cuda-|triton==|torch==)' requirements.txt > "$RUNNER_TEMP/requirements-cpu.txt"
          uv venv
          uv pip install --index-url https://download.pytorch.org/whl/cpu "torch==${torch_version}+cpu"
          uv pip install -r "$RUNNER_TEMP/requirements-cpu.txt" "mypy==2.4.0" "types-PyYAML==6.0.12.20260906"

      - name: mypy grace
        run: .venv/bin/mypy grace

  semgrep-registry:
    name: SAST (Semgrep registry rules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # semgrep gets a venv of its own: installed into the project environment
      # it replaced opentelemetry with an older release and crashed on import.
      - name: Install semgrep in an isolated venv
        run: |
          python -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install --quiet "semgrep==1.182.1"

      - name: semgrep (p/python + p/security-audit)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: /tmp/semgrep-venv/bin/semgrep scan --error --quiet --metrics off --config=p/python --config=p/security-audit grace scripts

  gitleaks-history:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      - name: gitleaks over every commit
        run: gitleaks git . --no-banner --redact --verbose

  # One fail-closed context for branch protection: green only when every
  # extended scan above succeeded (a skipped or cancelled scan fails it).
  extended-scans:
    name: extended-scans
    if: always()
    needs: [mypy, semgrep-registry, gitleaks-history]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every extended scan passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "an extended scan ended with '$r' (all: $RESULTS)"; exit 1; }
          done
          echo "all extended scans passed: $RESULTS"
